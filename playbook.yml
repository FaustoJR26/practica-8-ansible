---
- name: Configurar los cinco servidores Ubuntu
  hosts: servidores
  become: yes

  tasks:
    - name: Actualizar cache de APT
      apt:
        update_cache: yes
        cache_valid_time: 0

    - name: Crear usuario itla
      user:
        name: itla
        state: present
        create_home: yes
        shell: /bin/bash

    - name: Crear carpeta app
      file:
        path: /app
        state: directory
        owner: itla
        group: itla
        mode: '0755'

    - name: Crear archivo hola.txt
      copy:
        content: "Hola mundo desde Ansible en Docker\n"
        dest: /app/hola.txt
        owner: itla
        group: itla
        mode: '0644'

    - name: Instalar cowsay y htop
      apt:
        name:
          - cowsay
          - htop
        state: present
